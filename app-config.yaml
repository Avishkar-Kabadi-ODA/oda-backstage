app:
  baseUrl: ${APP_BASE_URL}

backend:
  baseUrl: ${APP_BASE_URL}
  listen:
    port: 7007
    host: 0.0.0.0
  cors:
    origin: ${APP_BASE_URL}
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      ssl:
        rejectUnauthorized: true
        ca:
          $file: /app/certs/global-bundle.pem

auth:
  providers:
    guest:
      dangerouslyAllowOutsideDevelopment: true

techdocs:
  builder: external
  publisher:
    type: awsS3
    awsS3:
      bucketName: my-backstage-docs
      region: us-east-1

catalog:
  rules:
    - allow: [Component, System, API, Resource, Location, User, Group, Domain]
  locations: []
  providers:
    awsS3:
      docsEntities:
        bucketName: my-backstage-docs
        prefix: catalog/
        region: us-east-1
        schedule:
          frequency: { minutes: 5 }
          timeout: { minutes: 3 }